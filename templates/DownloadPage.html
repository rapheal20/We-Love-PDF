<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>
</head>
<body>    
    <div style="padding: 80px 20px; background: #f8f9fa; text-align: center;">
        <h2>Your PDF/PDFs have been processed!!</h2>
        {% for f in outputFiles %}
            <a href="{{ url_for('download', filename=f) }}" style="display: inline-block; background: #e5322d; color: white; text-decoration: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px;">
                Download {{ outputType }} {% if outputFiles|length > 1 %} (Part {{ loop.index }}){% endif %}
            </a>
        {% endfor %}
    </div>
</body>
</html>
