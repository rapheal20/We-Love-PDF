<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>
</head>
<body>    
    <div style="position: relative; min-height: 100vh; font-family: sans-serif; background-color: #f8f9fa; padding: 40px; box-sizing: border-box;">
        <h2 align="center">PDFs have been processed!</h2>

        <div style="padding: 80px 20px; background: #f8f9fa; text-align: center; cursor: pointer; transition: border-color 0.2s;">
            <button type="button" id="downloadBtn" style="background: #e5322d; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;">
                Download {{ outputType }}
            </button>
        </div>

    </div>
</body>
</html>
